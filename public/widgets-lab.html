<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>Widgets · HomeHub</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f4ef;
        --ink: #202120;
        --muted: #787972;
        --line: #deded5;
        --mint: #bee5d7;
        --lilac: #dfd4f6;
        --peach: #ffdbac;
        --blue: #c7e7f2;
        --row: 128px;
        --gap: 14px;
        --rail: 68px;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.42;
      }
      button:focus-visible,
      section[tabindex]:focus-visible {
        outline: 3px solid #478873;
        outline-offset: 4px;
      }
      button,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        touch-action: manipulation;
      }
      input,
      textarea,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        padding: 11px 12px;
        font-size: 16px;
      }
      textarea {
        resize: vertical;
        line-height: 1.6;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid #8fb6a6;
        outline-offset: 1px;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .rail {
        position: fixed;
        z-index: 30;
        left: max(10px, env(safe-area-inset-left));
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 7px;
        width: 50px;
        border: 1px solid #fff;
        border-radius: 22px;
        background: #fffffff2;
        box-shadow: 0 6px 30px #3035270c;
      }
      .rail button {
        position: relative;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 13px;
        background: transparent;
        min-height: 36px;
        width: 34px;
      }
      .rail button:hover {
        background: var(--paper);
      }
      .rail button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
      }
      .rail .brand {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: var(--mint);
        font-weight: 800;
        margin-bottom: 6px;
      }
      .rail .divider {
        width: 22px;
        height: 1px;
        background: var(--line);
        margin: 4px auto;
      }
      .rail .badge {
        position: absolute;
        right: -3px;
        top: -2px;
        min-width: 16px;
        padding: 1px 3px;
        border-radius: 8px;
        font-size: 9px;
        font-weight: 800;
        background: var(--peach);
        color: var(--ink);
      }
      .workspace {
        padding: 24px 24px 80px calc(var(--rail) + 14px);
        max-width: 1440px;
        margin: auto;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
        min-height: 32px;
      }
      .heading-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 {
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -1px;
      }
      .count {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 7px;
      }
      .page-meta {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      .example-badge {
        padding: 5px 8px;
        border-radius: 8px;
        background: #ede9e0;
        white-space: nowrap;
      }
      .saved {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .saved::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #689b83;
      }
      .stage {
        min-height: calc(100dvh - 115px);
        touch-action: pan-y pinch-zoom;
      }
      body.editing .stage {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: var(--row);
        grid-auto-flow: row dense;
        gap: var(--gap);
        align-content: start;
      }
      .widget {
        position: relative;
        min-width: 0;
        min-height: 0;
        border-radius: 26px;
        container-type: inline-size;
      }
      .surface {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border: 1px solid #00000004;
        border-radius: inherit;
        background: var(--tone, #fff);
        color: var(--text, var(--ink));
        padding: 20px;
        box-shadow: 0 6px 12px #242c2310;
      }
      .widget[data-rows="1"] .surface {
        padding: 15px 17px;
      }
      .widget[data-id="clock"],
      .widget[data-id="finance"] {
        --tone: #242625;
        --text: #fff;
      }
      .widget[data-id="tasks"],
      .widget[data-id="my-tasks"],
      .widget[data-id="specific-list"] {
        --tone: var(--mint);
      }
      .widget[data-id="month-calendar"],
      .widget[data-id="calendar"],
      .widget[data-id="progress"] {
        --tone: var(--lilac);
      }
      .widget[data-id="shopping"],
      .widget[data-id="pinned-note"],
      .widget[data-id="specific-note"] {
        --tone: var(--peach);
      }
      .widget[data-id="family"],
      .widget[data-id="week"],
      .widget[data-id="member-summary"] {
        --tone: var(--blue);
      }
      .widget-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding-right: 20px;
        flex-shrink: 0;
        margin-bottom: 14px;
        min-height: 21px;
      }
      .widget-header h2 {
        font-size: clamp(12px, 5cqw, 19px);
        line-height: 1.25;
        letter-spacing: -0.4px;
        font-weight: 750;
        overflow-wrap: anywhere;
      }
      .widget-header svg {
        width: 18px;
        height: 18px;
      }
      .widget-main {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .review-button {
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 27px;
        height: 27px;
        border: 0;
        border-radius: 50%;
        background: #ffffff50;
        color: inherit;
        opacity: 0.72;
      }
      .widget[data-id="clock"] .review-button,
      .widget[data-id="finance"] .review-button {
        color: #fff;
      }
      .review-button svg {
        width: 14px;
        height: 14px;
      }
      .review-button.has-note {
        background: var(--ink);
        color: #fff;
        opacity: 1;
      }
      .edit-controls {
        display: none;
      }
      body.editing .widget {
        cursor: grab;
        outline: 1px dashed #9caa9f;
        outline-offset: 3px;
      }
      body.editing .widget.selected {
        outline: 2px solid #477e6c;
        outline-offset: 3px;
      }
      body.editing .edit-controls {
        display: contents;
      }
      body.editing .widget-main button {
        pointer-events: none;
      }
      .widget-control {
        position: absolute;
        z-index: 5;
        border: 1px solid #e5e7df;
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: 0 2px 6px #0000000b;
      }
      .remove {
        left: -8px;
        top: -8px;
      }
      .resize {
        bottom: -7px;
        right: -7px;
        width: 32px;
        height: 32px;
        border-radius: 11px;
        cursor: nwse-resize;
        touch-action: none;
      }
      .resize svg {
        width: 16px;
        height: 16px;
      }
      .widget.is-dragging .surface {
        opacity: 0.2;
      }
      .widget.is-dragging {
        outline: 2px dashed #477e6c;
      }
      .drag-ghost {
        position: fixed;
        z-index: 80;
        pointer-events: none;
        margin: 0;
        opacity: 0.95;
        filter: drop-shadow(0 16px 18px #00000020);
        transform-origin: center;
      }
      .drag-ghost .review-button,
      .drag-ghost .edit-controls {
        display: none;
      }
      .stat {
        font-size: clamp(28px, 17cqw, 58px);
        font-weight: 780;
        line-height: 1.05;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        opacity: 0.61;
      }
      .label {
        font-size: 12px;
        opacity: 0.65;
        line-height: 1.4;
      }
      .stat-line {
        display: flex;
        align-items: baseline;
        gap: 9px;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      .tiny {
        justify-content: center;
        gap: 7px;
        padding-right: 9px;
      }
      .tiny .label {
        font-size: clamp(10px, 5cqw, 13px);
        font-weight: 650;
        opacity: 0.7;
      }
      .tiny .stat {
        font-size: clamp(22px, 14cqw, 42px);
        letter-spacing: -1px;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      .tiny .text-value {
        font-size: clamp(12px, 7cqw, 22px);
        line-height: 1.2;
        letter-spacing: -0.5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        min-width: 0;
      }
      .row-text {
        min-width: 0;
        flex: 1;
        font-size: clamp(11px, 5cqw, 14px);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .row-meta {
        display: block;
        opacity: 0.58;
        font-size: 11px;
        margin-top: 2px;
      }
      .check {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 19px;
        height: 19px;
        border: 1px solid currentColor;
        opacity: 0.5;
        border-radius: 7px;
      }
      .check.done {
        background: #294f3c;
        border-color: #294f3c;
        opacity: 0.75;
        color: #fff;
      }
      .check svg {
        width: 12px;
        height: 12px;
      }
      .completed {
        text-decoration: line-through;
        opacity: 0.55;
      }
      .avatar {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--avatar, #9ecadf);
        font-size: 13px;
        font-weight: 750;
        color: #263f41;
      }
      .avatar.small {
        width: 25px;
        height: 25px;
        font-size: 10px;
      }
      .person-line {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      .person-name {
        font-size: clamp(14px, 8cqw, 22px);
        font-weight: 750;
        letter-spacing: -0.5px;
      }
      .metric-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: auto;
      }
      .metric-list div {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .metric-list strong {
        font-size: clamp(13px, 6cqw, 21px);
        font-variant-numeric: tabular-nums;
      }
      .family-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
        margin: auto 0;
      }
      .family-person {
        min-width: 0;
        text-align: center;
        font-size: 11px;
      }
      .family-person .avatar {
        margin: 0 auto 7px;
      }
      .family-person .label {
        margin-top: 4px;
        font-size: 10px;
      }
      .list-card {
        padding: 10px 12px;
        border-radius: 15px;
        background: #ffffff6b;
      }
      .list-card .row {
        padding: 0;
      }
      .progress-track {
        height: 5px;
        background: #00000010;
        border-radius: 8px;
        margin-top: 11px;
        overflow: hidden;
      }
      .progress-track i {
        display: block;
        height: 100%;
        background: currentColor;
        border-radius: inherit;
      }
      .note-title {
        font-size: clamp(15px, 8cqw, 28px);
        font-weight: 750;
        line-height: 1.3;
        letter-spacing: -0.7px;
        margin-bottom: 12px;
      }
      .note-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: clamp(12px, 5cqw, 17px);
        line-height: 1.75;
        opacity: 0.78;
      }
      .note-date {
        margin-top: auto;
        padding-top: 12px;
        font-size: 11px;
        opacity: 0.5;
      }
      .member-month {
        text-transform: capitalize;
        margin-bottom: 15px;
      }
      .date-chip {
        width: 36px;
        height: 39px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #ffffff70;
        flex-shrink: 0;
      }
      .date-chip strong {
        font-size: 17px;
        line-height: 1;
      }
      .date-chip span {
        margin-top: 3px;
        font-size: 9px;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .bill-amount {
        font-size: clamp(12px, 5cqw, 18px);
        font-weight: 700;
        white-space: nowrap;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #bc914e;
        flex-shrink: 0;
      }
      .ring-wrap {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        min-height: 0;
      }
      .ring {
        position: relative;
        width: min(82%, 170px);
        aspect-ratio: 1;
        flex-shrink: 1;
        min-height: 0;
      }
      .ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        stroke-width: 6;
      }
      .ring .ring-number {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(23px, 17cqw, 45px);
        font-weight: 750;
        letter-spacing: -2px;
      }
      .clock {
        justify-content: center;
        gap: 12px;
      }
      .clock time {
        font-size: clamp(27px, 21cqw, 99px);
        font-weight: 750;
        letter-spacing: -3px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .clock .weekday {
        font-size: clamp(13px, 7cqw, 23px);
        text-transform: capitalize;
      }
      .quick-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .quick-button {
        min-width: 0;
        border: 0;
        border-radius: 13px;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 12px;
      }
      .quick-button:hover {
        background: var(--mint);
      }
      .calendar-main {
        overflow: hidden;
      }
      .month-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 3px;
        flex-shrink: 0;
        margin-bottom: 12px;
        min-height: 30px;
      }
      .month-heading strong {
        font-size: clamp(12px, 5cqw, 23px);
        text-transform: capitalize;
        letter-spacing: -0.6px;
      }
      .month-heading button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 10px;
        background: #ffffff65;
        flex-shrink: 0;
      }
      .month-heading button svg {
        width: 15px;
        height: 15px;
      }
      .weekday-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        flex-shrink: 0;
        text-align: center;
        font-size: clamp(9px, 2.8cqw, 14px);
        opacity: 0.55;
        margin-bottom: 5px;
      }
      .month-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        grid-template-rows: repeat(6, minmax(0, 1fr));
        gap: 3px;
        flex: 1;
        min-height: 0;
      }
      .day {
        display: grid;
        place-items: center;
        position: relative;
        min-width: 0;
        min-height: 0;
        padding: 1px;
        border: 0;
        background: none;
        border-radius: 10px;
        font-size: clamp(9px, 3.5cqw, 23px);
        line-height: 1;
      }
      .day:hover {
        background: #ffffff60;
      }
      .day.outside {
        opacity: 0.25;
      }
      .day .date-pill {
        display: grid;
        place-items: center;
        width: min(90%, 2.1em);
        height: min(90%, 2.1em);
        border-radius: 10px;
      }
      .day.today .date-pill {
        background: var(--ink);
        color: #fff;
      }
      .day.selected:not(.today) .date-pill {
        box-shadow: inset 0 0 0 1px currentColor;
      }
      .day-markers {
        position: absolute;
        bottom: 2px;
        display: flex;
        gap: 2px;
      }
      .day-markers i {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #8161af;
      }
      .day-markers i.bill {
        background: #b38232;
      }
      .day-markers i.reminder {
        background: #397b62;
      }
      .focus-strip {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0 0 20px;
      }
      .focus-strip button {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .focus-strip strong {
        font-size: 14px;
        text-align: center;
        min-width: 0;
      }
      body.focus-mode .focus-strip {
        display: flex;
      }
      body.focus-mode .board {
        max-width: 960px;
        margin: 0 auto;
      }
      .empty {
        grid-column: 1/-1;
        grid-row: span 2;
        display: grid;
        place-items: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 24px;
        font-size: 14px;
      }
      dialog {
        padding: 0;
        border: 1px solid #fff;
        border-radius: 25px;
        background: #faf9f6;
        color: var(--ink);
        width: min(390px, calc(100vw - 24px));
        max-height: calc(100dvh - 24px);
        box-shadow: 0 20px 80px #00000026;
      }
      dialog::backdrop {
        background: #242a2438;
        backdrop-filter: blur(2px);
      }
      .sheet {
        position: fixed;
        margin: 0;
        left: auto;
        right: 12px;
        top: 12px;
        height: calc(100dvh - 24px);
      }
      .dialog-layout {
        display: flex;
        flex-direction: column;
        max-height: inherit;
        height: 100%;
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 20px 15px;
        flex-shrink: 0;
      }
      .dialog-header h2 {
        font-size: 19px;
        letter-spacing: -0.7px;
      }
      .icon-button {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #eaeae4;
        flex-shrink: 0;
      }
      .dialog-content {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0 20px 22px;
        flex: 1;
        min-height: 0;
      }
      .field {
        display: block;
        margin-bottom: 19px;
      }
      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 750;
        margin-bottom: 8px;
      }
      #widget-adjustments {
        margin-bottom: 20px;
      }
      #widget-adjustments > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 11px 13px;

          for (let rows = 1; rows <= 4; rows++) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "size-button";
            button.dataset.cols = String(cols);
            button.dataset.rows = String(rows);
            button.setAttribute("aria-label", "Tamaño " + cols + " por " + rows);
            button.setAttribute(
              "aria-pressed",
              String(widget?.cols === cols && widget?.rows === rows),
            );
            button.disabled = !widget;
            button.innerHTML =
              '<span class="size-shape" style="width:' +
              cols * 12 +
              "px;height:" +
              rows * 7 +
              'px" aria-hidden="true"></span><span>' +
              cols +
              " × " +
              rows +
              "</span>";
            grid.append(button);
          }
        for (const button of $("#review-state").querySelectorAll("button"))
          button.setAttribute(
            "aria-pressed",
            String(!general && state.reviews[id].status === button.dataset.status),
          );
        const reference = $("#reference-field"),
          select = $("#widget-reference");
        const sources = {
          "specific-list": { label: "Lista", items: demoLists },
          "specific-note": { label: "Nota", items: demoNotes },
          "member-summary": { label: "Miembro", items: people },
        };
        const source = sources[id];
        reference.hidden = !source;
        if (source) {
          $("#reference-label").textContent = source.label;
          select.replaceChildren(
            ...source.items.map((item) => {
              const option = document.createElement("option");
              option.value = item.id;
              option.textContent = item.name || item.title;
              return option;
            }),
          );
          select.value = state.refs[id];
        }
        const index = state.layout.findIndex((w) => w.id === id);
        $("#move-earlier").disabled = index <= 0;
        $("#move-later").disabled = index < 0 || index >= state.layout.length - 1;
      }
      function openReview(id, showSettings = false) {
        if (!knownIds.has(id) && id !== "__general__") return;
        selectedId = id === "__general__" ? null : id;
        renderBoard(false);
        fillInspector(id);
        $("#widget-adjustments").open = showSettings;
        openDialog("inspector");
      }
      function renderCatalogue() {
        $("#catalogue-grid").innerHTML = CATALOG.map((w) => {
          const added = state.layout.some((x) => x.id === w.id);
          return (
            '<button type="button" class="catalogue-item" data-add="' +
            w.id +
            '" aria-label="Añadir ' +
            w.title.toLocaleLowerCase("es") +
            '" ' +
            (added ? "disabled" : "") +
            '><div class="catalogue-top">' +
            icon(w.icon) +
            (added ? '<span class="added">Añadido ' + icon("check") + "</span>" : icon("plus")) +
            "</div><span>" +
            escapeText(w.title) +
            "</span></button>"
          );
        }).join("");
      }
      function addWidget(id) {
        if (!knownIds.has(id) || state.layout.some((w) => w.id === id)) return;
        const { cols, rows } = describe(id);
        state.layout.push({ id, cols, rows });
        selectedId = id;
        if (focusMode) focusId = id;
        persist();
        renderBoard();
        renderCatalogue();
      }
      function removeWidget(id) {
        if (!knownIds.has(id)) return;
        cancelGesture(true);
        state.layout = state.layout.filter((w) => w.id !== id);
        if (focusId === id) focusId = state.layout[0]?.id || "month-calendar";
        if (selectedId === id) selectedId = null;
        persist();
        renderBoard();
        $("#announcement").textContent = describe(id).title + " quitado del inicio";
      }
      function changeSize(id, cols, rows) {
        const widget = state.layout.find((w) => w.id === id);
        if (!widget) return;
        widget.cols = cols;
        widget.rows = rows;
        persist();
        renderBoard();
        if ($("#inspector").open) {
          for (const b of $("#size-grid").querySelectorAll("button"))
            b.setAttribute(
              "aria-pressed",
              String(Number(b.dataset.cols) === cols && Number(b.dataset.rows) === rows),
            );
        }
      }
      function placeWidget(id, target) {
        const from = state.layout.findIndex((w) => w.id === id),
          to = state.layout.findIndex((w) => w.id === target);
        if (from < 0 || to < 0 || from === to) return false;
        const [item] = state.layout.splice(from, 1);
        state.layout.splice(to, 0, item);
        renderBoard();
        return true;
      }
      function moveWidget(id, delta) {
        const index = state.layout.findIndex((w) => w.id === id),
          next = index + delta;
        if (index < 0 || next < 0 || next >= state.layout.length) return;
        placeWidget(id, state.layout[next].id);
        persist();
        $("#announcement").textContent = describe(id).title + ", posición " + (next + 1);
        if ($("#inspector").open) fillInspector(reviewId);
      }
      function reviewText() {
        const lines = ["HOMEHUB · REVISIÓN DE WIDGETS", new Date().toLocaleDateString("es"), ""];
        if (state.general.trim()) lines.push("INDICACIONES GENERALES", state.general.trim(), "");
        lines.push("DISPOSICIÓN");
        state.layout.forEach((w, i) => {
          let ref = "";
          if (w.id === "specific-list") ref = " · " + selectedList().name;
          if (w.id === "specific-note") ref = " · " + selectedNote().title;
          if (w.id === "member-summary") ref = " · " + selectedPerson().name;
          lines.push(i + 1 + ". " + describe(w.id).title + " · " + w.cols + " × " + w.rows + ref);
        });
        lines.push("", "INDICACIONES POR WIDGET");
        const statuses = { pending: "Pendiente", changes: "Quiero cambios", approved: "Me gusta" };
        for (const w of CATALOG) {
          const review = state.reviews[w.id];
          if (!review.comment.trim() && review.status === "pending") continue;
          lines.push(
            "",
            "[" + w.title + "] " + statuses[review.status],
            review.comment.trim() || "Sin comentario.",
          );
        }
        return lines.join("\n");
      }
      async function copyReview() {
        const text = reviewText();
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
          await navigator.clipboard.writeText(text);
          toast("Revisión copiada");
          return;
        } catch {
          const target = document.createElement("textarea");
          target.value = text;
          target.readOnly = true;
          target.setAttribute("aria-label", "Revisión para copiar");
          const host =
            [...document.querySelectorAll("dialog")].find((d) => d.open) || document.body;
          Object.assign(target.style, {
            position: "fixed",
            left: "0",
            top: "0",
            width: "1px",
            height: "1px",
            opacity: "0",
          });
          host.append(target);
          target.focus();
          target.select();
          let copied = false;
          try {
            copied = document.execCommand("copy");
          } catch {}
          target.remove();
          if (copied) {
            toast("Revisión copiada");
            return;
          }
          openDialog("share-dialog");
          let fallback = $("#copy-fallback");
          if (!fallback) {
            fallback = document.createElement("textarea");
            fallback.id = "copy-fallback";
            fallback.rows = 8;
            fallback.readOnly = true;
            fallback.setAttribute("aria-label", "Selecciona y copia tu revisión");
            $("#share-dialog .dialog-content").append(fallback);
          }
          fallback.value = text;
          fallback.focus();
          fallback.select();
          toast("Selecciona y copia tu revisión");
        }
      }
      function downloadReview() {
        const data = { ...state, exportedAt: new Date().toISOString() };
        const url = URL.createObjectURL(
          new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }),
        );
        const link = document.createElement("a");
        link.href = url;
        link.download = "homehub-widgets-" + localKey(new Date()) + ".json";
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      $("#preview-toggle").addEventListener("click", () => setEditing(false));
      $("#edit-toggle").addEventListener("click", () => setEditing(!editing));
      $("#focus-toggle").addEventListener("click", () => setFocus(!focusMode));
      $("#previous-widget").addEventListener("click", () => cycleFocus(-1));
      $("#next-widget").addEventListener("click", () => cycleFocus(1));
      $("#review-toggle").addEventListener("click", () => openReview("__general__"));
      $("#catalogue-toggle").addEventListener("click", () => {
        renderCatalogue();
        openDialog("catalogue");
      });
      $("#export-toggle").addEventListener("click", () => openDialog("share-dialog"));
      $("#reset-layout").addEventListener("click", () => {
        cancelGesture(true);
        state.layout = freshState().layout;
        selectedId = null;
        persist();
        renderBoard();
        toast("Disposición restablecida");
      });
      $("#catalogue-grid").addEventListener("click", (event) => {
        const button = event.target.closest("[data-add]");
        if (button && !button.disabled) addWidget(button.dataset.add);
      });
      $("#review-widget").replaceChildren(
        ...[{ id: "__general__", title: "Indicaciones generales" }, ...CATALOG].map((w) => {
          const option = document.createElement("option");
          option.value = w.id;
          option.textContent = w.title;
          return option;
        }),
      );
      $("#review-widget").addEventListener("change", (event) => fillInspector(event.target.value));
      $("#instructions").addEventListener("input", (event) => {
        if (reviewId === "__general__") state.general = event.target.value;
        else state.reviews[reviewId].comment = event.target.value;
        persist();
      });
      $("#review-state").addEventListener("click", (event) => {
        const button = event.target.closest("[data-status]");
        if (!button || !knownIds.has(reviewId)) return;
        state.reviews[reviewId].status = button.dataset.status;
        for (const b of $("#review-state").querySelectorAll("button"))
          b.setAttribute("aria-pressed", String(b === button));
        persist();
      });
      $("#size-grid").addEventListener("click", (event) => {
        const button = event.target.closest("[data-cols]");
        if (button && !button.disabled)
          changeSize(reviewId, Number(button.dataset.cols), Number(button.dataset.rows));
      });
      $("#widget-reference").addEventListener("change", (event) => {
        if (!["specific-list", "specific-note", "member-summary"].includes(reviewId)) return;
        state.refs[reviewId] = event.target.value;
        persist();
        renderBoard();
      });
      $("#move-earlier").addEventListener("click", () => moveWidget(reviewId, -1));
      $("#move-later").addEventListener("click", () => moveWidget(reviewId, 1));
      $("#focus-from-review").addEventListener("click", () => {
        $("#inspector").close();
        setFocus(true, reviewId);
      });
      $("#copy-review").addEventListener("click", copyReview);
      $("#copy-all").addEventListener("click", copyReview);
      $("#download-review").addEventListener("click", downloadReview);
      $("#export-json").addEventListener("click", downloadReview);
      $("#share-review").addEventListener("click", async () => {
        if (!navigator.share) {
          await copyReview();
          return;
        }
        try {
          await navigator.share({ title: "HomeHub · Mis indicaciones", text: reviewText() });
        } catch (error) {
          if (error.name !== "AbortError") await copyReview();
        }
      });
      let importSequence = 0;
      $("#import-review").addEventListener("change", async (event) => {
        const file = event.target.files[0],
          version = ++importSequence;
        if (!file) return;
        try {
          if (file.size > 1024 * 1024) throw new Error("Archivo demasiado grande");
          const loaded = validateState(JSON.parse(await file.text()));
          if (version !== importSequence) return;
          cancelGesture(true);
          state = loaded;
          selectedId = null;
          persist();
          renderBoard(false);
          $("#share-dialog").close();
          toast("Revisión importada");
        } catch {
          toast("No se pudo importar esa revisión");
        } finally {
          event.target.value = "";
        }
      });
      for (const button of document.querySelectorAll("[data-close]"))
        button.addEventListener("click", () => $("#" + button.dataset.close).close());
      for (const dialog of document.querySelectorAll("dialog"))
        dialog.addEventListener("click", (event) => {
          if (event.target !== dialog) return;
          const r = dialog.getBoundingClientRect();
          if (
            event.clientX < r.left ||
            event.clientX > r.right ||
            event.clientY < r.top ||
            event.clientY > r.bottom
          )
            dialog.close();
        });
      board.addEventListener("click", (event) => {
        if (performance.now() < suppressClickUntil) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;
        if (action === "review") {
          openReview(button.dataset.id);
          return;
        }
        if (action === "remove") {
          removeWidget(button.dataset.id);
          return;
        }
        if (action === "resize") {
          openReview(button.dataset.id, true);
          return;
        }
        if (editing) return;
        if (action === "month") {
          displayedMonth = new Date(
            displayedMonth.getFullYear(),
            displayedMonth.getMonth() + Number(button.dataset.delta),
            1,
          );
          renderBoard(false);
        }
        if (action === "day") {
          selectedDay = button.dataset.date;
          renderBoard(false);
        }
        if (action === "quick") {
          quickKind = button.dataset.kind;
          $("#quick-title").textContent = {
            tasks: "Tarea de ejemplo",
            shopping: "Producto de ejemplo",
            calendar: "Evento de ejemplo",
            notes: "Nota de ejemplo",
          }[quickKind];
          $("#quick-input").value = "";
          openDialog("quick-dialog");
          $("#quick-input").focus();
        }
      });
      $("#quick-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const title = $("#quick-input").value.trim();
        if (!title) return;
        if (quickKind === "tasks") demoTasks.push({ title, member: "ana", done: false });
        if (quickKind === "shopping") demoLists[0].items.push([title, false]);
        if (quickKind === "calendar")
          demoEvents.push({ title, date: plusDays(1), time: "12:00", kind: "event" });
        if (quickKind === "notes")
          demoNotes.push({ id: "example-" + Date.now(), title, body: "", pinned: false });
        $("#quick-dialog").close();
        renderBoard();
        toast("Añadido al ejemplo");
      });
      board.addEventListener("keydown", (event) => {
        const card = event.target.closest(".widget");
        if (!editing || !card || event.target !== card) return;
        if (event.key === "Enter") {
          event.preventDefault();
          openReview(card.dataset.id);
        }
        if (["ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"].includes(event.key)) {
          event.preventDefault();
          const id = card.dataset.id;
          moveWidget(id, ["ArrowUp", "ArrowLeft"].includes(event.key) ? -1 : 1);
          board.querySelector('[data-id="' + id + '"]')?.focus({ preventScroll: true });
        }
      });

      let gesture = null,
        pan = null,
        suppressClickUntil = 0,
        frame = 0;
      const pointers = new Map();
      const cloneLayout = () => state.layout.map((w) => ({ ...w }));
      const centroid = () => {
        const values = [...pointers.values()];
        return {
          x: values.reduce((a, p) => a + p.x, 0) / values.length,
          y: values.reduce((a, p) => a + p.y, 0) / values.length,
        };
      };
      function cancelGesture(revert = true) {
        const g = gesture;
        if (!g) return;
        clearTimeout(g.timer);
        cancelAnimationFrame(frame);
        frame = 0;
        gesture = null;
        g.ghost?.remove();
        if (revert && g.active) {
          state.layout = g.original;
          persist();
        }
        renderBoard(false);
      }
      function stopInteractions() {
        cancelGesture(true);
        pan = null;
        for (const id of pointers.keys())
          try {
            stage.releasePointerCapture(id);
          } catch {}
        pointers.clear();
      }
      function activateGesture() {
        const g = gesture;
        if (!g || g.active || pan) return;
        const card = board.querySelector('[data-id="' + g.id + '"]');
        if (!card) return;
        try {
          stage.setPointerCapture(g.pointer);
        } catch {}
        g.active = true;
        selectedId = g.id;
        for (const node of board.querySelectorAll(".widget"))
          node.classList.toggle("selected", node === card);
        if (g.kind === "move") {
          const ghost = card.cloneNode(true);
          ghost.classList.add("drag-ghost");
          ghost.classList.remove("selected");
          ghost.setAttribute("aria-hidden", "true");
          ghost.setAttribute("inert", "");
          ghost.tabIndex = -1;
          Object.assign(ghost.style, {
            left: g.rect.left + "px",
            top: g.rect.top + "px",
            width: g.rect.width + "px",
            height: g.rect.height + "px",
          });
          document.body.append(ghost);
          g.ghost = ghost;
          card.classList.add("is-dragging");
        }
        $("#announcement").textContent =
          (g.kind === "move" ? "Moviendo " : "Cambiando tamaño de ") + describe(g.id).title;
        schedulePaint();
      }
      function schedulePaint() {
        if (!frame) frame = requestAnimationFrame(paintGesture);
      }
      function paintGesture() {
        frame = 0;
        const g = gesture;
        if (!g?.active || pan) return;
        const dx = g.lastX - g.x,
          dy = g.lastY - g.y;
        if (g.kind === "move") {
          g.ghost.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.025)";
          const target = document.elementFromPoint(g.lastX, g.lastY)?.closest(".widget");
          const id = target?.dataset.id;
          if (
            id &&
            id !== g.id &&
            board.contains(target) &&
            Math.hypot(g.lastX - g.lastSwapX, g.lastY - g.lastSwapY) > 14
          ) {
            if (placeWidget(g.id, id)) {
              g.lastSwapX = g.lastX;
              g.lastSwapY = g.lastY;
            }
          }
          const amount = g.lastY < 65 ? -8 : g.lastY > innerHeight - 65 ? 8 : 0;
          if (amount) {
            window.scrollBy(0, amount);
            schedulePaint();
          }
        } else {
          const cols = Math.max(
            1,
            Math.min(3, Math.round((g.rect.width + dx + g.columnGap) / (g.unit + g.columnGap))),
          );
          const rows = Math.max(
            1,
            Math.min(4, Math.round((g.rect.height + dy + g.rowGap) / (g.rowUnit + g.rowGap))),
          );
          const current = state.layout.find((w) => w.id === g.id);
          if (current && (current.cols !== cols || current.rows !== rows))
            changeSize(g.id, cols, rows);
        }
      }
      function finishGesture() {
        const g = gesture;
        if (!g) return;
        clearTimeout(g.timer);
        cancelAnimationFrame(frame);
        frame = 0;
        gesture = null;
        if (g.active) {
          suppressClickUntil = performance.now() + 600;
          persist();
          const card = board.querySelector('[data-id="' + g.id + '"]');
          card?.classList.remove("is-dragging");
          if (g.ghost) {
            const ghost = g.ghost;
            if (!matchMedia("(prefers-reduced-motion: reduce)").matches && ghost.animate) {
              const r = card?.getBoundingClientRect();
              const destination = r
                ? "translate(" +
                  (r.left - g.rect.left) +
                  "px," +
                  (r.top - g.rect.top) +
                  "px) scale(1)"
                : "none";
              const a = ghost.animate(
                [
                  { transform: ghost.style.transform, opacity: 0.95 },
                  { transform: destination, opacity: 0 },
                ],
                { duration: 160, easing: "ease-out" },
              );
              a.finished.catch(() => {}).then(() => ghost.remove());
            } else ghost.remove();
          }
          $("#announcement").textContent = describe(g.id).title + " colocado";
        } else g.ghost?.remove();
      }
      stage.addEventListener("pointerdown", (event) => {
        if (!editing || (event.pointerType !== "touch" && event.button !== 0)) return;
        if (event.pointerType === "touch")
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size >= 2) {
          cancelGesture(true);
          pan = { lastY: centroid().y };
          suppressClickUntil = performance.now() + 1000;
          for (const id of pointers.keys())
            try {
              stage.setPointerCapture(id);
            } catch {}
          event.preventDefault();
          return;
        }
        if (pan) return;
        const card = event.target.closest(".widget");
        if (!card) return;
        const control = event.target.closest("button");
        if (control && control.dataset.action !== "resize") return;
        if (gesture) cancelGesture(true);
        const styles = getComputedStyle(board),
          columnGap = parseFloat(styles.columnGap) || 0,
          rowGap = parseFloat(styles.rowGap) || 0;
        gesture = {
          id: card.dataset.id,
          pointer: event.pointerId,
          kind: control?.dataset.action === "resize" ? "resize" : "move",
          x: event.clientX,
          y: event.clientY,
          lastX: event.clientX,
          lastY: event.clientY,
          lastSwapX: event.clientX,
          lastSwapY: event.clientY,
          rect: card.getBoundingClientRect(),
          original: cloneLayout(),
          active: false,
          unit: (board.clientWidth - 2 * columnGap) / 3,
          columnGap,
          rowGap,
          rowUnit: parseFloat(styles.gridAutoRows) || 128,
        };
        gesture.timer = setTimeout(activateGesture, 240);
      });
      window.addEventListener(
        "pointermove",
        (event) => {
          if (pointers.has(event.pointerId))
            pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (pan) {
            if (pointers.size >= 2) {
              const y = centroid().y;
              window.scrollBy(0, pan.lastY - y);
              pan.lastY = y;
            }
            if (event.cancelable) event.preventDefault();
            return;
          }
          const g = gesture;
          if (!g || g.pointer !== event.pointerId) return;
          g.lastX = event.clientX;
          g.lastY = event.clientY;
          if (!g.active && Math.hypot(g.lastX - g.x, g.lastY - g.y) > 7) activateGesture();
          if (g.active) {
            if (event.cancelable) event.preventDefault();
            schedulePaint();
          }
        },
        { passive: false },
      );
      window.addEventListener("pointerup", (event) => {
        pointers.delete(event.pointerId);
        if (pan) {
          suppressClickUntil = performance.now() + 600;
          if (!pointers.size) pan = null;
          return;
        }
        if (gesture?.pointer === event.pointerId) finishGesture();
      });
      window.addEventListener("pointercancel", () => {
        stopInteractions();
        suppressClickUntil = performance.now() + 600;
      });
      window.addEventListener("blur", stopInteractions);
      window.addEventListener("resize", stopInteractions);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopInteractions();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && (gesture || pan)) {
          event.preventDefault();
          stopInteractions();
        }
      });
      document.addEventListener(
        "click",
        (event) => {
          if (performance.now() < suppressClickUntil && stage.contains(event.target)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true,
      );
      paintIcons();
      $("#import-icon").innerHTML = icon("upload");
      renderBoard(false);
      updateReviewCount();
      if (!storageAvailable) $("#saved-status").textContent = "Sin guardar";
      setInterval(() => {
        const text = new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
        for (const clock of document.querySelectorAll("[data-live-clock]"))
          clock.textContent = text;
      }, 15000);
    </script>
