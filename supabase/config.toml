project_id = "skendal-homehub"

[functions.household-photos]
# Paired tablets use their device token; the function validates my_context and
# the household-scoped metadata before signing any private object.
verify_jwt = false

[functions.member-avatars]
# Each request validates its account/device household before signing avatar paths.
verify_jwt = false

[functions.billing-qa-user]
# Uses a short-lived management-issued test capability, with an independent
# cleanup capability. It cannot provision or remove ordinary user identities.
verify_jwt = false
